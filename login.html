<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 - 대경 Tracking</title><link rel="stylesheet" href="css/style.css?v=1232"></head>
<body class="login-page"><main class="login-shell"><section class="login-card">
<div class="cloud-mark">☁</div><h1>대경 Tracking</h1><p class="hint">발급받은 대경 계정으로 로그인하세요.</p>
<form id="loginForm"><label for="loginUsername">아이디</label><input id="loginUsername" type="text" autocomplete="username" required><label for="loginPassword">비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" required><button class="btn primary login-btn" id="loginBtn" type="submit">로그인</button></form>
<p id="loginMessage" class="hint mt" role="status" aria-live="polite"></p>
<button class="btn login-btn" id="forgotBtn" type="button" aria-expanded="false" aria-controls="recoveryPanel">비밀번호 찾기</button>
<section id="recoveryPanel" hidden><h2>비밀번호 재설정</h2><p class="hint">계정에 등록된 수신 가능한 이메일을 입력하세요.</p><form id="recoveryForm"><label for="recoveryEmail">등록된 이메일</label><input id="recoveryEmail" type="email" autocomplete="email" required><button class="btn primary login-btn" id="sendResetBtn" type="submit">재설정 이메일 보내기</button></form><p id="recoveryMessage" class="hint mt" role="status" aria-live="polite"></p></section>
<div class="cloud-help">아이디를 잊었거나 이메일을 사용할 수 없다면 관리자에게 문의하세요.<details><summary>관리자 안내</summary>계정 확인·초기화: 환경설정 → 사용자 관리. 등록 이메일 확인: Supabase Authentication → Users.</details></div>
</section></main><script src="js/vendor-core.js?v=1214"></script><script src="js/config.js?v=1214"></script><script src="js/cloud.js?v=114recovery1"></script><script src="js/login.js?v=114recovery1"></script></body></html>
